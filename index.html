<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>間違えた問題ノート</title>
<meta name="description" content="QBで間違えた問題を、電波が無くても見て解ける">
<meta name="theme-color" content="#0f5c8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QBノート">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* 配置：上に同期（読み込み・書き出し）と要約、その下に切替と問題カード。解くときは1問ずつ全面表示 */
:root{
  --bg:#f1f4f7; --card:#ffffff; --ink:#1b2430; --sub:#5d6b7c; --line:#dde3ea;
  --accent:#0f5c8a; --accent-ink:#ffffff;
  --miss:#c2284d; --tri:#a35f00; --ok:#1d7a4b; --soft:#e8eef4;
  --font:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --card:#1b222b; --ink:#e6ebf1; --sub:#9aa7b6; --line:#2a333f;
  --accent:#6db3e0; --accent-ink:#0b1117; --miss:#ff7d9b; --tri:#ffb347; --ok:#5fd58f; --soft:#232c37; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --card:#1b222b; --ink:#e6ebf1; --sub:#9aa7b6; --line:#2a333f;
  --accent:#6db3e0; --accent-ink:#0b1117; --miss:#ff7d9b; --tri:#ffb347; --ok:#5fd58f; --soft:#232c37; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.75;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:16px 72px}
h1{font-size:22px;margin:0;letter-spacing:.02em}
.meta{color:var(--sub);font-size:13px;margin-top:2px}
.sync{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:12px 0;font-size:13px;color:var(--sub)}
.sync .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.sync .row button{flex:1;min-width:140px}
.sync .row input{flex:2;min-width:180px;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.sync details summary{font-size:13px;margin-top:8px}
#recvBtn,#sendBtn{padding:10px 14px}
.pcbox{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.pcbox b{color:var(--ink);font-size:13px}
.pend{color:var(--tri);font-weight:700}
.mbadge{position:fixed;left:8px;bottom:8px;z-index:50;padding:2px 8px;border-radius:10px;font-size:12px;color:#fff;background:#0a7;opacity:.85;pointer-events:none}
.mbadge.off{background:#888}
.grpgo{margin-left:10px;flex:none;font-size:13px;padding:4px 10px;border-color:var(--accent);color:var(--accent);font-weight:700}
.hist .free{opacity:.6}
.pill.free{border-style:dashed}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;margin:14px 0 6px;font-variant-numeric:tabular-nums}
.stats b{font-size:20px;margin-right:2px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-radius:0;padding:7px 12px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:focus-visible,select:focus-visible,summary:focus-visible,.pickable:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls.main{flex-direction:column;align-items:stretch;gap:4px}
.controls.main button{padding:12px 14px;font-size:16px}
.controls.main .note{text-align:center}
.seg button small{font-size:12px;opacity:.8;margin-left:2px}
.seg button.j-x{color:var(--miss)}.seg button.j-t{color:var(--tri)}
.seg button.j-x[aria-pressed="true"]{background:var(--miss);color:var(--accent-ink)}
.seg button.j-t[aria-pressed="true"]{background:var(--tri);color:var(--accent-ink)}
.controls.sub{margin-top:4px;font-size:13px}
.controls.sub select,.controls.sub button{font-size:13px;padding:5px 10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-block:10px}
.top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--sub)}
.qid{font-weight:700;color:var(--accent);font-size:15px}
.pill{border:1px solid currentColor;border-radius:999px;padding:0 10px;font-size:12px;font-variant-numeric:tabular-nums}
.pill.miss{color:var(--miss)}.pill.prog{color:var(--ok)}.pill.due{color:var(--accent)}
.pill.late{color:var(--accent-ink);background:var(--miss);border-color:var(--miss)}.pill.done{color:var(--accent-ink);background:var(--ok);border-color:var(--ok)}
.q{margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.choice{padding:2px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.choice.ans{color:var(--ok);font-weight:700}
.choice.pickable{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
.choice.picked{border-color:var(--accent);background:var(--soft)}
.choice.ng{color:var(--miss);border-color:var(--miss)}
.choice.pickable.ans{border-color:var(--ok)}
details summary{cursor:pointer;color:var(--accent);margin-top:8px}
.exp{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.hist{margin-top:8px;font-size:13px;color:var(--sub);display:flex;flex-wrap:wrap;gap:2px 14px;font-variant-numeric:tabular-nums}
.x{color:var(--miss)}.t{color:var(--tri)}.o{color:var(--ok)}
img.qimg{display:block;max-width:100%;border-radius:6px;margin-top:8px;background:#fff}
.noimg{font-size:13px;color:var(--sub);margin-top:8px}
details.grp>summary.subj{list-style:none;cursor:pointer;color:var(--ink);font-weight:700;margin:14px 0 2px;padding:10px 4px;
  border-bottom:2px solid var(--accent);display:flex;align-items:baseline}
details.grp>summary.subj::-webkit-details-marker{display:none}
details.grp>summary.subj::before{content:"▸";color:var(--accent);margin-right:8px}
details.grp[open]>summary.subj::before{content:"▾"}
details.grp>summary.subj>span{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--sub);font-weight:400}
.empty{padding:36px 8px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.judge{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-weight:700}
.jbtn{min-width:56px;font-size:20px;font-weight:700;padding:6px 12px}
.jbtn.on.j-x{background:var(--miss);border-color:var(--miss);color:var(--accent-ink)}
.jbtn.on.j-t{background:var(--tri);border-color:var(--tri);color:var(--accent-ink)}
.jbtn.on.j-o{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}
.judge .note{font-weight:400;font-size:13px;color:var(--sub)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.nav button{padding:10px 18px}
.pill.ok{color:var(--ok)}
.stat{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.pill.leech{color:var(--accent-ink);background:var(--tri);border-color:var(--tri);font-weight:700}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:14px 0 0;border-bottom:3px solid var(--accent)}
.tabbar button{border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;background:var(--card);padding:10px 4px 8px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.3;font-weight:700;min-width:0}
.tabbar button .tl{font-size:15px;overflow-wrap:anywhere;text-align:center}
.tabbar button small{font-size:11px;font-weight:400;color:var(--sub);text-align:center;line-height:1.35}
@media (max-width:480px){.tabbar .long{display:none}}
.tabbar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabbar button[aria-pressed="true"] small{color:var(--accent-ink)}
.tabsub{display:flex;gap:8px;justify-content:flex-end;margin:8px 0 4px}
.tabsub button{font-size:13px;padding:4px 12px}
.tabsub button small{color:var(--sub)}
.tabsub button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabsub button[aria-pressed="true"] small{color:var(--accent-ink)}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:0 10px;font-size:12px;background:transparent}
.chip.pick{cursor:pointer;padding:3px 12px;font-size:13px}
.chip.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chip .x{border:0;background:transparent;color:inherit;padding:0 0 0 4px;font-size:14px;line-height:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.tags input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;width:9em}
.tags>button:not(.chip){padding:4px 10px}
.tagbar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.note{font-size:13px;color:var(--sub)}
.subq{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.subq.done .choice{opacity:.85}
.acts{margin-top:10px;display:flex;gap:8px}
.acts button{font-size:13px;padding:4px 10px}
.resume{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:10px 0}
.resume span{flex:1;min-width:200px}
.nav button[disabled]{opacity:.4;cursor:default}
.toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);
  border-radius:10px;padding:10px 14px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div class="wrap">
  <h1>間違えた問題ノート</h1>
  <div class="sync">
    <div id="dataLine">読み込み中…</div>
    <div id="recLine"></div>
    <div id="syncLine"></div>
    <div class="row">
      <button id="catchupBtn" hidden title="iPad・スマホのQBで解いた分を、QBのサーバーからPCに読み込みます（PCのEdgeで拡張機能が入っているときだけ出ます）">QBからデータを読み込む</button>
      <button class="go" id="syncBtn" title="この端末の記録を送り、最新の問題データ・ほかの端末の記録・画像を受け取ります（PCでは拡張機能のデータもまとめて送ります）">同期する</button>
    </div>
    <div id="pcBox" class="pcbox" hidden>
      <div id="catchupLine"></div>
      <div id="pcLine"></div>
      <div id="pcPend" class="pend" hidden>PCで記録した問題が、まだこの画面に出ていません（「同期する」を押すと出ます）</div>
    </div>
    <details id="syncSet">
      <summary>同期の設定</summary>
      <div class="row">
        <input id="ghRepo" placeholder="ユーザー名/qb-note-data" autocomplete="off" autocapitalize="off" spellcheck="false">
        <input id="ghToken" type="password" placeholder="合鍵（トークン）を貼り付け" autocomplete="off">
        <button id="ghSave">保存</button>
      </div>
    </details>
    <details>
      <summary>ファイルで受け渡し（同期できないとき）</summary>
      <div class="row">
        <button id="importBtn">問題データを読み込む</button>
        <button id="exportBtn">記録を書き出す</button>
      </div>
    </details>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
  <div class="stats" id="stats"></div>

  <div id="listView">
    <div class="resume" id="resume" hidden></div>
    <!-- 見出しのタブ（横並び）：総復習｜今日間違えた｜科目別｜年度別｜タグ。日付別・苦手・克服済みはその下に小さく -->
    <nav class="tabbar" id="tabs" aria-label="表示">
      <button data-tab="due" aria-pressed="false"><span class="tl">総復習</span><small></small></button>
      <button data-tab="today" aria-pressed="false"><span class="tl">今日<span class="long">間違えた</span></span><small></small></button>
      <button data-tab="subject" aria-pressed="false"><span class="tl">科目別</span><small></small></button>
      <button data-tab="exam" aria-pressed="false"><span class="tl">年度別</span><small></small></button>
      <button data-tab="tag" aria-pressed="false"><span class="tl">タグ</span><small></small></button>
    </nav>
    <div class="tabsub" id="tabs2">
      <button data-tab="date" aria-pressed="false"><span class="tl">日付別</span> <small></small></button>
      <button data-tab="leech" aria-pressed="false"><span class="tl">苦手</span> <small></small></button>
      <button data-tab="cleared" aria-pressed="false"><span class="tl">克服済み</span> <small></small></button>
    </div>
    <!-- 何を解くか：×・△で分ける（どのタブでも）／今日間違えたの範囲／絞り込み → 開始ボタン → 一覧の見方 -->
    <div class="controls">
      <div class="seg" id="judgeSeg" role="group" aria-label="×・△で分ける" title="最後に間違えたときの判定で分けます（今日間違えたのタブは今日の判定）">
        <button data-j="all" aria-pressed="true">×・△ <small></small></button>
        <button class="j-x" data-j="x" aria-pressed="false">×だけ <small></small></button>
        <button class="j-t" data-j="t" aria-pressed="false">△だけ <small></small></button>
      </div>
      <select id="todaySrc" aria-label="今日間違えた問題の範囲" hidden>
        <option value="all">QB＋総復習で間違えた問題</option>
        <option value="qb">QBで間違えた問題だけ</option>
        <option value="due">総復習で間違えた問題だけ</option>
      </select>
      <select id="filter" aria-label="絞り込み">
        <option value="all">絞り込みなし</option>
        <option value="triRun">△が2回以上続いている</option>
        <option value="missRun">×・△が2回以上続いている</option>
        <option value="neverOk">まだ一度も○になっていない</option>
        <option value="stale">2週間以上解いていない</option>
      </select>
    </div>
    <div class="controls main">
      <button class="go" id="start">1問ずつ解く</button>
      <span class="note" id="startNote"></span>
    </div>
    <div class="controls sub">
      <select id="sort" aria-label="並び順">
        <option value="miss">間違い回数が多い順</option>
        <option value="recent">最近間違えた順</option>
        <option value="first">登録が古い順</option>
        <option value="stale">最後に解いたのが古い順</option>
        <option value="tri">△が多い順</option>
        <option value="x">×が多い順</option>
        <option value="triRun">△が続いている順</option>
      </select>
      <button id="openToggle">すべて開く</button>
    </div>
    <div class="tagbar" id="tagBar" hidden></div>
    <div id="list"></div>
  </div>
  <div id="reviewView" hidden></div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
